<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PANHA COFFEE by OWEN LOUIS</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
body {
margin: 0;
padding: 20px;
min-height: 100vh;
font-family: 'Segoe UI', sans-serif;
color: white;
background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
url('https://i.pinimg.com/originals/3f/44/e1/3f44e122cfc5609777dba1331525c078.gif');
background-size: cover;
background-attachment: fixed;
background-position: center;
}

h1, h2 {
text-align: center;
color: #00ffff;
text-shadow: 0 0 15px #00ffff;
text-transform: uppercase;
}

/* Panel Kontrol Status Toko */
.status-toko-box {
background: rgba(0, 0, 0, 0.85);
border: 2px solid #00ffff;
border-radius: 20px;
padding: 25px;
margin-bottom: 40px;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
text-align: center;
}

.status-display-badge {
background: rgba(0, 0, 0, 0.8);
border: 2px solid #00ffff;
color: #00ffff;
padding: 12px;
border-radius: 30px;
font-weight: bold;
font-size: 1.1rem;
margin: 15px auto;
max-width: 400px;
}

.status-buttons {
display: flex;
gap: 15px;
justify-content: center;
margin-top: 20px;
}

.btn-status {
padding: 12px 30px;
border: none;
border-radius: 10px;
font-weight: bold;
cursor: pointer;
text-transform: uppercase;
font-size: 1rem;
transition: 0.3s;
}

.btn-buka-manual { background: #00cc44; color: white; }
.btn-tutup-manual { background: #ff4d4d; color: white; }
.btn-auto { background: #00ffff; color: black; }

.btn-status:hover { transform: scale(1.05); filter: brightness(1.2); }

/* Kotak Pengelolaan Stok */
.stok-manager-box {
background: rgba(0, 0, 0, 0.85);
border: 2px solid #00ffff;
border-radius: 20px;
padding: 25px;
margin-bottom: 40px;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.stok-list {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 15px;
margin-top: 20px;
}

.stok-item {
background: rgba(20, 20, 20, 0.9);
border: 1px solid #00ffff;
border-radius: 12px;
padding: 15px;
text-align: center;
}

.stok-item img {
width: 100%;
height: 120px;
object-fit: cover;
border-radius: 8px;
margin-bottom: 10px;
}

.stok-controls {
display: flex;
gap: 5px;
margin-top: 10px;
justify-content: center;
}

.stok-input {
width: 60px;
padding: 8px;
text-align: center;
background: black;
color: white;
border: 1px solid #00ffff;
border-radius: 5px;
font-weight: bold;
}

.btn-update-stok {
background: #ffea00;
color: black;
border: none;
padding: 8px 12px;
border-radius: 5px;
font-weight: bold;
cursor: pointer;
}

.tanggal-group {
border: 1px solid rgba(0, 255, 255, 0.3);
border-radius: 20px;
padding: 25px;
margin-bottom: 50px;
background: rgba(0, 0, 0, 0.7);
backdrop-filter: blur(10px);
}

.tanggal-label {
background: #ffea00;
color: black;
padding: 12px 30px;
display: inline-block;
border-radius: 10px;
font-weight: bold;
font-size: 1.3rem;
margin-bottom: 25px;
}

.btn-hapus-tgl {
background: #ff4d4d;
color: white;
border: none;
padding: 12px 20px;
border-radius: 8px;
cursor: pointer;
float: right;
font-weight: bold;
text-transform: uppercase;
}

.rekap-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 25px;
clear: both;
}

.rekap-card {
background: rgba(20, 20, 20, 0.9);
border: 2px solid #00ffff;
border-radius: 15px;
overflow: hidden;
display: flex;
flex-direction: column;
}

.rekap-header {
background: #00ffff;
color: black;
padding: 12px;
font-weight: bold;
text-align: center;
text-transform: uppercase;
}

.rekap-body { padding: 15px; flex-grow: 1; }

.produk-row {
display: flex;
justify-content: space-between;
padding: 10px 0;
border-bottom: 1px solid rgba(0, 255, 255, 0.2);
font-weight: bold;
color: #00ffff;
}

.pembeli-box {
margin-top: 15px;
padding: 12px;
background: rgba(255, 255, 255, 0.05);
border-radius: 8px;
font-size: 0.9rem;
color: #ffea00;
border-left: 4px solid #ffea00;
}

.total-situs {
background: rgba(0, 255, 255, 0.1);
color: white;
padding: 12px;
text-align: center;
font-weight: bold;
border-top: 1px solid #00ffff;
}

.btn-hapus-situs {
background: #ff4d4d;
color: white;
border: none;
padding: 12px;
cursor: pointer;
font-weight: bold;
width: 100%;
text-transform: uppercase;
}

@media (max-width: 1100px) { .rekap-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 750px) { .rekap-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>📊 ADMIN PANHA COFFEE</h1>

<!-- PANEL KONTROL STATUS TOKO -->
<div class="status-toko-box">
    <h2>🏪 KONTROL STATUS TOKO</h2>
    <div class="status-display-badge" id="statusTampilanAdmin">Memuat status toko...</div>
    <p style="font-size: 0.9rem; color: #ffea00; margin-bottom: 15px;">Jadwal otomatis: BUKA 18:00 — TUTUP 00:00</p>
    <div class="status-buttons">
        <button class="btn-status btn-buka-manual" onclick="aturStatusToko('BUKA_MANUAL')">BUKA</button>
        <button class="btn-status btn-tutup-manual" onclick="aturStatusToko('TUTUP_MANUAL')">TUTUP</button>
        <button class="btn-status btn-auto" onclick="aturStatusToko('AUTO')">AUTO</button>
    </div>
</div>

<!-- PANEL KELOLA STOK -->
<div class="stok-manager-box">
    <h2>📦 KELOLA STOK PRODUK</h2>
    <div class="stok-list" id="stokManagerList">
        <p style="text-align:center;">Memuat data stok...</p>
    </div>
</div>

<h2>📋 REKAP PESANAN</h2>
<div id="masterAdmin"></div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyD8d5HgUxJhU3qy5qsb-j2TwFWam-ASjuI",
authDomain: "owen-caffe.firebaseapp.com",
databaseURL: "https://owen-caffe-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "owen-caffe",
storageBucket: "owen-caffe.appspot.com",
appId: "1:374030985787:web:1f9ddf8ecf3d8d1cb58a1e"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// Fungsi Mengubah Status Toko ke Firebase
function aturStatusToko(mode) {
database.ref('pengaturan/status_toko').set(mode, (error) => {
if (error) {
alert("Gagal mengubah status toko!");
} else {
alert("Status toko berhasil diubah ke: " + mode);
}
});
}

// Pantau Status Toko di Admin
database.ref('pengaturan/status_toko').on('value', (snapshot) => {
const mode = snapshot.val() || 'AUTO';
const badge = document.getElementById('statusTampilanAdmin');
const sekarang = new Date();
const jam = sekarang.getHours();
const menit = sekarang.getMinutes();
const waktuSkg = (jam * 100) + menit;
const isAutoOpen = (waktuSkg >= 1800 || waktuSkg < 0);

let statusReal = isAutoOpen;
let teksStatus = "";

if (mode === 'BUKA_MANUAL') {
statusReal = true;
teksStatus = "🟢 TOKO BUKA (MANUAL)";
} else if (mode === 'TUTUP_MANUAL') {
statusReal = false;
teksStatus = "🔴 TOKO TUTUP (MANUAL)";
} else {
teksStatus = isAutoOpen ? "🟢 TOKO BUKA (OTOMATIS)" : "🔴 TOKO TUTUP (OTOMATIS)";
}

badge.innerText = teksStatus;
badge.style.color = statusReal ? "#00ffff" : "#ff4d4d";
});

// 1. RENDER KONTROL STOK DI ADMIN
database.ref('stok_produk/').on('value', (snapshot) => {
const data = snapshot.val();
const stokContainer = document.getElementById('stokManagerList');
stokContainer.innerHTML = "";

if (data) {
Object.keys(data).forEach((id) => {
const item = data[id];
const stokSaatIni = item.stok !== undefined ? item.stok : 0;
stokContainer.innerHTML += `
<div class="stok-item">
    <img src="${item.img}" alt="${item.nama}">
    <div style="font-weight:bold; font-size:0.9rem; margin-bottom:5px;">${item.nama}</div>
    <div style="color:#00ffff; font-size:0.85rem;">Stok: <span id="label_stok_${id}">${stokSaatIni}</span></div>
    <div class="stok-controls">
        <input type="number" id="input_stok_${id}" class="stok-input" value="${stokSaatIni}" min="0">
        <button class="btn-update-stok" onclick="updateStok('${id}')">Simpan</button>
    </div>
</div>`;
});
} else {
stokContainer.innerHTML = "<p>Belum ada produk di database.</p>";
}
});

function updateStok(id) {
const inputVal = document.getElementById('input_stok_' + id).value;
const stokBaru = parseInt(inputVal);

if (isNaN(stokBaru) || stokBaru < 0) {
alert("Jumlah stok tidak valid!");
return;
}

database.ref('stok_produk/' + id).update({
stok: stokBaru
}, (error) => {
if (error) {
alert("Gagal mengupdate stok!");
} else {
alert("Stok berhasil diperbarui!");
}
});
}

// 2. RENDER REKAP PESANAN
function formatTanggalIndo(tglString) {
const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const part = tglString.split('-');
if (part.length !== 3) return tglString;
return `${parseInt(part[0])} ${bulanIndo[parseInt(part[1]) - 1]} ${part[2]}`;
}

function getTodayDate() {
const d = new Date();
return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
}

database.ref('pesanan/').on('value', (snapshot) => {
const data = snapshot.val();
const master = document.getElementById('masterAdmin');
master.innerHTML = "";

if (!data) {
master.innerHTML = "<p style='text-align:center;'>Belum ada data pesanan.</p>";
return;
}

const groups = {};
Object.keys(data).forEach(id => {
const p = data[id];
let tglKey = p.tanggal || getTodayDate();
const situs = p.SITUS || "LAIN-LAIN";

if (!groups[tglKey]) groups[tglKey] = {};
if (!groups[tglKey][situs]) {
groups[tglKey][situs] = { items: {}, pembeli: [], totalQty: 0 };
}

const qty = parseInt(p.jumlah) || 0;
groups[tglKey][situs].items[p.produk] = (groups[tglKey][situs].items[p.produk] || 0) + qty;
groups[tglKey][situs].totalQty += qty;

if (!groups[tglKey][situs].pembeli.includes(p.nama)) {
groups[tglKey][situs].pembeli.push(p.nama);
}
});

const sortedDates = Object.keys(groups).sort((a,b) => {
const da = a.split('-').reverse().join('');
const db = b.split('-').reverse().join('');
return db.localeCompare(da);
});

sortedDates.forEach(tgl => {
const section = document.createElement('div');
section.className = 'tanggal-group';
section.innerHTML = `
<button class="btn-hapus-tgl" onclick="hapusTanggal('${tgl}')">Hapus Hari Ini</button>
<div class="tanggal-label">🗓️ ${formatTanggalIndo(tgl)}</div>
`;

const grid = document.createElement('div');
grid.className = 'rekap-grid';

Object.keys(groups[tgl]).sort().forEach(situs => {
const info = groups[tgl][situs];
let produkHtml = "";
for (const [nama, qty] of Object.entries(info.items)) {
produkHtml += `<div class="produk-row"><span>🥤 ${nama}</span><span>${qty} Botol</span></div>`;
}

grid.innerHTML += `
<div class="rekap-card">
<div class="rekap-header">📍 ${situs}</div>
<div class="rekap-body">
${produkHtml}
<div class="pembeli-box"><b>Nama Pemesan:</b><br>${info.pembeli.join(', ')}</div>
</div>
<div class="total-situs">Total: ${info.totalQty} PCS</div>
<button class="btn-hapus-situs" onclick="hapusSitus('${tgl}', '${situs}')">Hapus Situs</button>
</div>`;
});

section.appendChild(grid);
master.appendChild(section);
});
});

function hapusSitus(tgl, situs) {
if (confirm(`Hapus data ${situs} untuk tanggal ${tgl}?`)) {
database.ref('pesanan/').once('value', (snap) => {
snap.forEach((child) => {
const p = child.val();
const tglData = p.tanggal || getTodayDate();
if (tglData === tgl && (p.SITUS === situs || (!p.SITUS && situs === "LAIN-LAIN"))) {
child.ref.remove();
}
});
});
}
}

function hapusTanggal(tgl) {
if (confirm(`Hapus SEMUA data untuk tanggal ${tgl}?`)) {
database.ref('pesanan/').once('value', (snap) => {
snap.forEach((child) => {
const p = child.val();
const tglData = p.tanggal || getTodayDate();
if (tglData === tgl) {
child.ref.remove();
}
});
});
}
}
</script>
</body>
</html>
